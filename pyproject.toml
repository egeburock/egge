[project]
name = "binance-signal-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "pandas>=2.2",
  "ta>=0.11",
  "python-telegram-bot>=21.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
